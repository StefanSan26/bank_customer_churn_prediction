name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Phase 1 - Data and features
        run: python scripts/test_pipeline_phase1_data_features.py
        continue-on-error: true

      - name: Phase 2 - Modeling
        run: python scripts/test_pipeline_phase2_modeling.py
        continue-on-error: true
